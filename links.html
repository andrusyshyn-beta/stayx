<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayX - Оренда квартир у Варшаві</title>
  <meta name="description" content="Знайдіть ідеальну квартиру у Варшаві разом зі StayX.">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0a2540; /* StayX dark blue */
      --btn-bg: rgba(255, 255, 255, 0.1);
      --btn-hover: rgba(255, 255, 255, 0.15);
      --accent: #635bff;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.7);
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Background effects */
    .bg-mesh {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -1;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
    }
    .orb-1 {
      top: -100px;
      left: -100px;
      width: 300px;
      height: 300px;
      background: var(--accent);
    }
    .orb-2 {
      bottom: -100px;
      right: -100px;
      width: 400px;
      height: 400px;
      background: #80e9ff;
      opacity: 0.2;
    }
    
    .container {
      width: 100%;
      max-width: 680px;
      padding: 60px 20px 40px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    /* Profile Section */
    .profile {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo-text {
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      letter-spacing: -1px;
    }
    .x-accent {
      color: var(--accent);
    }
    .profile-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 500;
    }
    
    /* Links */
    .links-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }
    
    .link-btn {
      display: flex;
      align-items: center;
      width: 100%;
      background-color: var(--btn-bg);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 99px;
      padding: 16px 24px;
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }
    
    .link-btn:hover {
      background-color: var(--btn-hover);
      transform: translateY(-2px);
    }
    
    .link-btn--primary {
      background-color: var(--accent);
      border-color: var(--accent);
    }
    
    .link-btn--primary:hover {
      background-color: #524be0;
      box-shadow: 0 8px 20px rgba(99, 91, 255, 0.4);
    }
    
    .link-icon {
      width: 40px;
      height: 40px;
      background: #0088cc; /* Telegram blue */
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 16px;
    }
    
    .link-btn--primary .link-icon {
      background: rgba(255,255,255,0.2);
    }
    
    .link-icon svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }
    
    .link-text {
      flex-grow: 1;
      text-align: center;
      padding-right: 40px; /* Offset the icon width to center text visually */
    }
    
    /* Socials */
    .socials {
      display: flex;
      gap: 24px;
      margin-bottom: 40px;
    }
    
    .social-btn {
      color: var(--text);
      transition: opacity 0.2s ease;
    }
    
    .social-btn:hover {
      opacity: 0.7;
    }
    
    /* Footer */
    .footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .site-btn {
      background: #fff;
      color: var(--bg);
      padding: 14px 32px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      transition: transform 0.2s ease;
    }
    .site-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
