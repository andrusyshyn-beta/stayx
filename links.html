<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayX - Оренда квартир у Варшаві</title>
  <meta name="description" content="Знайдіть ідеальну квартиру у Варшаві разом зі StayX.">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* Specific Linktree Styles */
    body {
      margin: 0;
      padding: 0;
      background: #0a2540; /* Same as .hero */
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    
    .hero-bg-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 600px;
      padding: 50px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: center;
    }
    
    /* Transparent Card with Outline */
    .card {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      width: 100%;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: none;
      padding: 56px 32px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
    
    /* Profile Section */
    .profile {
      text-align: center;
      margin-bottom: 48px;
    }
    .logo-text {
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      letter-spacing: -1.5px;
      display: inline-block;
      margin-bottom: 16px;
    }
    .x-accent { color: #635bff; }
    .profile-title {
      font-size: 24px;
      font-weight: 800;
      margin: 0;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .profile-subtitle {
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      margin-top: 6px;
      font-weight: 500;
    }
    
    /* Links */
    .links-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }
    
    /* Interactive Buttons */
    .link-btn {
      display: flex;
      align-items: center;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 16px 20px;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      
      /* Entrance animation */
      opacity: 0;
      animation: floatUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .link-btn:nth-child(1) { animation-delay: 0.1s; }
    .link-btn:nth-child(2) { animation-delay: 0.2s; }
    .link-btn:nth-child(3) { animation-delay: 0.3s; }
    .link-btn:nth-child(4) { animation-delay: 0.4s; }
    
    .link-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      border-color: rgba(255,255,255,0.3);
    }
    
    /* Vibrant Primary Button */
    .link-btn--primary {
      background: linear-gradient(135deg, #635bff 0%, #4a3aff 100%);
      border: none;
      box-shadow: 0 12px 30px rgba(99, 91, 255, 0.3);
    }
    .link-btn--primary:hover {
      background: linear-gradient(135deg, #746eff 0%, #524be0 100%);
      box-shadow: 0 20px 40px rgba(99, 91, 255, 0.5);
      border: none;
    }
    
    .link-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 14px;
      transition: transform 0.3s ease;
    }
    .link-btn:hover .link-icon { transform: scale(1.1) rotate(5deg); }
    
    .link-icon svg {
      width: 100%;
      height: 100%;
    }
    
    .link-text {
      flex-grow: 1;
      text-align: left;
    }
    
    /* Socials */
    .socials {
      display: flex;
      gap: 20px;
      justify-content: center;
      opacity: 0;
      animation: floatUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }
    
    .social-btn {
      color: rgba(255,255,255,0.8);
      background: rgba(255, 255, 255, 0.08);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    
    .social-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      transform: translateY(-4px) scale(1.1);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      border-color: rgba(255,255,255,0.3);
    }

    .social-btn svg { width: 22px; height: 22px; }
    
    /* Footer */
    .links-footer {
      margin-top: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: floatUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }
    .site-btn {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.05);
      padding: 12px 28px;
      border-radius: 99px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .site-btn:hover {
      color: #fff;
      background: rgba(255,255,255,0.1);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    @media (max-width: 480px) {
      .wrapper { padding: 30px 16px; }
      .card { 
        padding: 40px 16px; 
        border-radius: 28px; 
        background: transparent; 
        backdrop-filter: none; 
        -webkit-backdrop-filter: none;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: none;
      }
      .link-btn { padding: 14px 16px; }
      .link-icon { width: 26px; height: 26px; margin-right: 12px; }
    }
  </style>
</head>
